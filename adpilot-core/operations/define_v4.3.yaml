# VERIFICATION
checklist:
  - "Содержат ли ВСЕ узлы (контейнеры и листья) блок `x-dcl-meta` с тремя осями?"
  - "Включены ли только конституционные атрибуты (строгое пересечение L1.1 + L2.1 + L3.1) без данных о состоянии (L3.2) и субъективных оценок (L2.2)?"
  - "Для КАЖДОГО измеримого `number`/`integer` задан ли непустой `unit_enum` (и отсутствуют ли единицы измерения в `description` или суффиксах ключей, а также ручные обёртки `{value, unit}`)? И стоит ли `unit_enum: null` для безразмерных чисел?"
  - "Не превышает ли глубина вложенности 3 семантических уровней и отсутствуют ли лишние подконтейнеры или `object`-обёртки из одного поля?"
  - "Согласованы ли `type`, `enum`, `items_type`, `unit_enum`, `properties` и `null` на неиспользуемых полях, и однозначно ли схема заполняется на этапе `EXTRACT` (с учётом Null Policy)?"
