# VERIFICATION
checklist:
  - "Содержат ли ВСЕ узлы `AttributeDef` (контейнеры и листья) блок `x-dcl-meta` с тремя осями?"
  - "Включены ли только конституционные атрибуты (строгое пересечение L1.1 + L2.1 + L3.1) без данных о состоянии (L3.2) и субъективных оценок (L2.2)?"
  - "Не превышает ли глубина вложенности 3 уровней и отсутствуют ли `object`-обёртки из одного поля?"
  - "Оформлены ли составные измерения через `{value, unit}` и закрытые словари через `enum` на скалярном `string`?"
  - "Согласованы ли `type`, `items_type`, `properties` и `null` на неиспользуемых полях, и однозначно ли схема заполняется на этапе `EXTRACT` (с учётом Null Policy)?"
