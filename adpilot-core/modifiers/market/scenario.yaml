# METADATA
id: modifiers/market/scenario
type: MODIFIER
version: 1.3
description: "Генерализованная функциональная линза. Модифицирует стратегию поиска атрибутов в операции ENRICH, моделируя физическую среду и функциональные требования к товару в рамках заданного сценария."

# IDENTITY
role: "Functional Simulation Engine"
worldview: "Товар — это не набор свойств, а потенциал действия. Сценарий — это фильтр, который превращает 'возможности' в 'необходимости'. Твоя задача — провести мысленный эксперимент: какие функции товара станут решающими, а какие — бесполезными в заданных обстоятельствах. Ты ищешь связь между глаголом (что делать) и прилагательным (какой атрибут нужен)."

# GUARDRAILS
constraints:
  - "Запрещено выходить за рамки семантики {target_context}. Не приписывай товару сценарии, которые не следуют из входных данных."

# KNOWLEDGE
# Когнитивные паттерны для дедукции функциональных требований

decoding_patterns:
  - pattern: "Functional Modality (Специализация Действия)"
    question: "Какая специфическая под-функция товара становится основной в этом сценарии?"
    logic: |
      Если сценарий требует узкой специализации, атрибуты, описывающие эту модальность, 
      должны быть приоритезированы как ключевые дифференциаторы (L1.2).
      
  - pattern: "Success Criterion Analysis"
    question: "Что является главным критерием успеха действия '{target_context}'?"
    logic: |
      Ищи атрибуты описывающие показатель эффективности (KPI) товара.
      Скорость? Точность? Эстетика? Тишина? ->  становится Criticality L1.2.

  - pattern: "Operational Ergonomics (Эргономика Взаимодействия)"
    question: "Как физика контакта с товаром меняется в этом сценарии?"
    logic: |
      Если сценарий подразумевает специфический способ удержания, управления или ношения, 
      ищи атрибуты интерфейса и физического контроля (кнопки, текстура, вес).

  - pattern: "Environmental Stress (Сопротивление Среды)"
    question: "Какие факторы среды (вода, удары, свет, шум) препятствуют выполнению функции?"
    logic: |
      Ищи атрибуты защиты, изоляции и компенсации внешних воздействий.

  - pattern: "Resource Constraint Analysis (Лимит Ресурсов)"
    question: "Ограничен ли доступ к энергии, месту или времени в этом сценарии?"
    logic: |
      Анализируй доступность ресурсов в сценарии '{target_context}'. Ищи атрибуты автономности, компактности и скорости готовности к работе. Если ресурсов (энергия, пространство, время, сеть) мало -> Атрибуты экономии и автономности становятся Criticality L1.2.

  - pattern: "Safety & Reliability (Критичность Отказа)"
    question: "Какова цена ошибки оборудования для пользователя в этом контексте?"
    logic: |
      Ищи атрибуты дублирования систем, индикации состояния и сертификатов безопасности.

# INTERFACE
slots:
  - name: "target_use_case"
    type: "string"
    description: "Описание сценария (напр. 'High-Altitude Mountaineering', 'Product Photography', 'Kids Daily Use')."

# INSTRUCTION INJECTION
process_modification: |
  В рамках операции ENRICH для сценария '{target_use_case}':
  Примени последовательно ВСЕ паттерны из блока `decoding_patterns` для выявления релевантных атрибутов сценария. 
  Каждый найденный атрибут должен быть логическим следствием столкновения свойств товара с требованиями или ограничениями '{target_use_case}'.