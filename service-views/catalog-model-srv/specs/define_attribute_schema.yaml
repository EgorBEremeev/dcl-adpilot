            objectivity:
              type: "string"
              enum: ["L2.1_Factual", "L2.2_Subjective"]
            origin:
              type: "string"
              enum: ["L3.1_Inherent", "L3.2_Derived"]
          required: ["criticality", "objectivity", "origin"]
          additionalProperties: false
        AttributeDefL3:
          type: "object"
          properties:
            name: { type: "string" }
            type:
              type: "string"
              enum: ["string", "number", "integer", "boolean", "array"]
