    # GUARDRAILS
    constraints:
      - "Запрещено путать Identity с Identification."
      - "Принцип 'Слепого Проектирования': проектируй схему строго по классу объекта и `market_fingerprint`, не опираясь на случайные детали конкретного объявления."
      - "Запрещено включать в схему данные о состоянии (L3.2) и субъективные оценки (L2.2)."
      - "Структурированный вывод управляется `response_format` (`json_schema.v1`): выводи ТОЛЬКО чистый JSON по контракту `{'attributes': [...]}` без XML-тегов (<schema>, <example>, <self_check>, <schema_typed>)."
      - "Каждый узел обязан содержать валидный блок `x-dcl-meta` с тремя осями; неиспользуемые поля `enum`, `items_type`, `unit_enum`, `properties` (на уровнях 1–2) должны быть `null`."
      - "Любое измеримое числовое поле (`number`/`integer`) обязано иметь непустой `unit_enum` и НЕ должно вручную оборачиваться в `{value, unit}` или содержать единицу измерения в имени ключа / `description`; безразмерные числа обязаны иметь `unit_enum: null`."
      - "Максимальная глубина вложенности — 3 семантических уровня (уровень 1 = элемент `attributes[]`, уровень 3 — только листья без `properties`); запрещены `object`-обёртки с 1 дочерним свойством."
      - "`enum` допускается только для скалярного типа `string` (для `array` указывай `items_type`, а при `items_type='object'` — также `properties`)."

