            enum:
              type: ["array", "null"]
              items: { type: "string" }
              description: "Allowed scalar values if categorical enum, otherwise null."
            items_type:
              type: ["string", "null"]
              enum: ["string", "number", "integer", "boolean", null]
              description: "Element type when type is 'array', otherwise null."
            unit_enum:
              type: ["array", "null"]
              items: { type: "string" }
              description: "Allowed measurement units (e.g. ['cm', 'mm'], ['GB', 'TB']) for dimensional number/integer fields; null for dimensionless or non-numeric fields."
            x-dcl-meta:
              $ref: "#/$defs/DclMeta"
          required: ["name", "type", "description", "enum", "items_type", "unit_enum", "x-dcl-meta"]
          additionalProperties: false
        AttributeDefL2:
          type: "object"
          properties:
            name: { type: "string" }
            type:
              type: "string"
              enum: ["string", "number", "integer", "boolean", "object", "array"]
            description: { type: "string" }
            enum:
              type: ["array", "null"]
              items: { type: "string" }
              description: "Allowed scalar values if categorical enum, otherwise null."
            items_type:
              type: ["string", "null"]
              enum: ["string", "number", "integer", "boolean", "object", null]
              description: "Element type when type is 'array', otherwise null."
            unit_enum:
              type: ["array", "null"]
              items: { type: "string" }
              description: "Allowed measurement units (e.g. ['cm', 'mm'], ['GB', 'TB']) for dimensional number/integer fields; null for dimensionless or non-numeric fields."
            properties:
              type: ["array", "null"]
              items: { $ref: "#/$defs/AttributeDefL3" }
              description: "Child attributes (level 3 leaves) when type is 'object' (or 'array' with items_type='object'), otherwise null."
            x-dcl-meta:
              $ref: "#/$defs/DclMeta"
          required: ["name", "type", "description", "enum", "items_type", "unit_enum", "properties", "x-dcl-meta"]
          additionalProperties: false
        AttributeDefL1:
          type: "object"
          properties:
            name: { type: "string" }
            type:
              type: "string"
              enum: ["string", "number", "integer", "boolean", "object", "array"]
            description: { type: "string" }
            enum:
              type: ["array", "null"]
              items: { type: "string" }
              description: "Allowed scalar values if categorical enum, otherwise null."
            items_type:
              type: ["string", "null"]
              enum: ["string", "number", "integer", "boolean", "object", null]
              description: "Element type when type is 'array', otherwise null."
            unit_enum:
              type: ["array", "null"]
              items: { type: "string" }
              description: "Allowed measurement units (e.g. ['cm', 'mm'], ['GB', 'TB']) for dimensional number/integer fields; null for dimensionless or non-numeric fields."
            properties:
              type: ["array", "null"]
              items: { $ref: "#/$defs/AttributeDefL2" }
              description: "Child attributes (level 2) when type is 'object' (or 'array' with items_type='object'), otherwise null."
            x-dcl-meta:
              $ref: "#/$defs/DclMeta"
          required: ["name", "type", "description", "enum", "items_type", "unit_enum", "properties", "x-dcl-meta"]
          additionalProperties: false
