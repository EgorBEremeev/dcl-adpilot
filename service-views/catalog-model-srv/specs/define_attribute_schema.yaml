        axis_logic: "L1.1 (Go/No-Go) + L2.1 (Fact) + L3.1 (Inherent)"
      - context: "Игровая консоль / серверный узел (unit_enum и 2 уровня вместо ручного value/unit)"
        reasoning: "Технические спецификации группируются в `specs` (уровень 1); объём накопителя `storage_capacity` (уровень 2) объявляется как `integer` с `unit_enum: ['GB', 'TB']` (runtime развернёт в `{value, unit}`), безразмерное количество портов `usb_ports_count` — `integer` с `unit_enum: null`, наличие привода — `boolean`."
        selected_attributes:
