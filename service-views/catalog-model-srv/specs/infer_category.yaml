# service-views/catalog-model-srv/specs/infer_category.yaml
service_id: "catalog-model-srv"
workflow_id: "catalog_modeling"
operation_id: "infer_category"
dcl_bundle: "adpilot-core"
dcl_instruction: "Determines the product category based on raw text description."
invocation:
  model_id: "gemini-2.0-flash"
  thinking_budget: 0
  system_instruction: |
    Ты — эксперт по классификации товаров. Твоя задача — определить наиболее подходящую категорию для товара на основе его текстового описания.
    
    Входные данные:
    - <source_text>: Описание товара от пользователя.
    - <catalog_state>: JSON-объект, где ключи — ID категорий, а значения — их полные пути.
    
    Требования:
    1. Проанализируй <source_text>.
    2. Найди в <catalog_state> наиболее подходящую категорию.
    3. Верни JSON с полем "candidates", содержащим список объектов с "category_id", "confidence" (0-1) и "reasoning".
    4. Если подходящей категории нет, верни пустой список candidates.
  output:
    mode: "static_structured"
    response_schema:
      type: "object"
      properties:
        candidates:
          type: "array"
          items:
            type: "object"
            properties:
              category_id: { type: "string" }
              confidence: { type: "number" }
              reasoning: { type: "string" }
            required: ["category_id", "confidence", "reasoning"]
      required: ["candidates"]
